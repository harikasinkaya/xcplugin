main: phonon.xc.XCPlugin
name: xc
version: 1.21.8
api-version: '1.21'
softdepend: [kotlin, WorldGuard]
commands:
  xc:
    description: xc
    aliases: []
    permission: xc.command
    usage: /xc help
  aimdownsights:
    description: Toggles gun aim down sights
    aliases: [ads]
    permission: xc.ads
    usage: /ads off
permissions:
  xc.admin:
    description: Allow xc admin commands
    default: op
