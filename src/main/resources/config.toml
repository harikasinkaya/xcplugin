# ═══════════════════════════════════════════════════
# BÖLÜM 1: Item config dizin yolları
# ═══════════════════════════════════════════════════
[configs]
ammo = "ammo"           # plugins/xc/ammo/ dizini
armor = "armor"
gun = "gun"
landmine = "landmine"
melee = "melee"
misc = "misc"
throwable = "throwable"

# ═══════════════════════════════════════════════════
# BÖLÜM 2: Custom item'lar için temel Material tipleri
# CustomModelData ile farklı silahlar aynı Material'i paylaşır
# ═══════════════════════════════════════════════════
[material]
gun = "WARPED_FUNGUS_ON_A_STICK"     # Sağ-tık cooldown yok
aim_down_sights = "CARROT_ON_A_STICK" # Offhand ADS modeli
melee = "IRON_SWORD"
throwable = "GOLDEN_HORSE_ARMOR"
ammo = "SNOWBALL"
armor = "LEATHER_HORSE_ARMOR"

# ═══════════════════════════════════════════════════
# BÖLÜM 3: Dahili depolama dizileri boyutu
# CustomModelData ID'si doğrudan array indeksi olarak kullanılır
# ═══════════════════════════════════════════════════
[max_types]
ammo = 512
gun = 1024
melee = 1024
throwable = 1024
hat = 1024

# ═══════════════════════════════════════════════════
# BÖLÜM 4: Ölüm mesajları ve loglama
# ═══════════════════════════════════════════════════
[deaths]
message_explosion = "{0} was guro''d in an explosion"
message_wither = "{0} suffocated in poison gas"
drop_head = true
log_save_dir = "plugins/xc/logs"
save_interval = 1200                  # Tick cinsinden (60 saniye)

# ═══════════════════════════════════════════════════
# BÖLÜM 5: Global silah ayarları
# ═══════════════════════════════════════════════════
[gun]
auto_fire_max_ticks_since_last_request = 4
recoil_recovery_rate = 0.2
auto_reload_guns = true
auto_fire_ticks_before_reload = 2

[landmine]
min_redstone_current = 5
disable_drop = true

[block_damage]
explosion = false

[sound]
on_hit = "minecraft:entity.experience_orb.pickup"
on_hit_enabled = true
on_hit_volume = 1.0

# ═══════════════════════════════════════════════════
# BÖLÜM 6: Zırh değer zorlama
# ═══════════════════════════════════════════════════
[armor]
enforce = false

[armor.values]
leather_boots = 3
leather_chestplate = 5
leather_helmet = 4
leather_leggings = 4
golden_boots = 3
golden_chestplate = 5
golden_helmet = 4
golden_leggings = 4
chainmail_boots = 3
chainmail_chestplate = 5
chainmail_helmet = 4
chainmail_leggings = 4
iron_boots = 3
iron_chestplate = 5
iron_helmet = 4
iron_leggings = 4
diamond_boots = 3
diamond_chestplate = 5
diamond_helmet = 4
diamond_leggings = 4
netherite_boots = 4
netherite_chestplate = 6
netherite_helmet = 5
netherite_leggings = 5

# ═══════════════════════════════════════════════════
# BÖLÜM 7: Anti-combat log
# ═══════════════════════════════════════════════════
[anti_combat_log]
enabled = true
timeout = 20.0

# ═══════════════════════════════════════════════════
# BÖLÜM 8: Motor ayarları
# ═══════════════════════════════════════════════════
[sway]
movement_speed_decay = 0.5
movement_threshold = 3.0
players_before_pipelined_sway = 4

[crawl]
only_allowed_on_crawl_weapons = true

[debug]
do_timings_default = false

[experimental]
async_packets = true
num_projectile_threads = 4
